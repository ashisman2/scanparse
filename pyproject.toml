[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanparse"
version = "0.1.0"
description = "Open-source parser for poor-quality English & Hindi scanned documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "scanparse authors", email = "scanparse@example.com"},
]
keywords = ["ocr", "hindi", "devanagari", "scanned-documents", "document-parsing", "image-preprocessing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# Keep the default install LIGHTWEIGHT and FAST:
# numpy + OpenCV + Pillow + Tesseract client only (~30 MB). Heavy models
# (Surya, VLM) are opt-in extras so small machines stay fast.
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8,<5",
    "Pillow>=10.0,<12",
    "pytesseract>=0.3,<1",
    "pdf2image>=1.16,<2",
    "jiwer>=3.0,<4",
    "lxml>=4.9,<6",
]

[project.optional-dependencies]
surya = ["surya-ocr>=0.6,<1"]
vlm = ["paddleocr>=2.8,<3", "torch>=2.1,<3"]
ui = ["gradio>=4.0,<6"]
all = [
    "scanparse[surya,ui]",
]
# Security-audit dependencies (optional, used by CI `security` job)
security = ["safety>=3,<4", "pip-audit>=2.7,<4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "build>=1.2",
]

[project.scripts]
scanparse = "scanparse.cli:main"

[tool.setuptools.packages.find]
include = ["scanparse*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
